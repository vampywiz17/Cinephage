name: Apply explicit library return-state fix

on:
  push:
    branches: [fix/library-preserve-filters]
    paths:
      - .github/workflows/apply-explicit-library-return.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/library-preserve-filters

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply explicit return-state wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count} for {old[:80]!r}')
              p.write_text(text.replace(old, new))

          # Shared explicit helper: no browser/global state required.
          path = 'src/lib/utils/routing.ts'
          text = Path(path).read_text()
          marker = "\n/**\n * Apply library list/detail return-state handling to a route before resolving it.\n"
          helper = r'''
/**
 * Attach an explicit, validated library-list return URL to a detail route.
 *
 * Unlike the legacy ambient browser-state path, callers can pass the exact list
 * URL they are rendering. This makes Movies and TV grid/table/mobile navigation
 * deterministic during SSR, hydration, and client-side updates.
 */
export function addLibraryReturnTo(detailPath: string, returnTo: string): string {
	try {
		const requested = new URL(detailPath, 'http://cinephage.local');
		const expectedListPath = expectedLibraryListPath(requested.pathname);
		if (!expectedListPath) return detailPath;

		const safeReturnTo = getSafeLibraryReturnTo(returnTo, expectedListPath);
		if (!safeReturnTo) return detailPath;

		requested.searchParams.set(RETURN_TO_PARAM, safeReturnTo);
		return `${requested.pathname}${requested.search}${requested.hash}`;
	} catch {
		return detailPath;
	}
}
'''
          if 'export function addLibraryReturnTo' not in text:
              idx = text.index(marker)
              text = text[:idx] + '\n' + helper + text[idx:]
              Path(path).write_text(text)

          # Grid cards receive returnTo explicitly from the list page.
          replace_exact(
              'src/lib/components/library/LibraryMediaCard.svelte',
              "\timport { resolvePath } from '$lib/utils/routing';",
              "\timport { addLibraryReturnTo, resolvePath } from '$lib/utils/routing';"
          )
          replace_exact(
              'src/lib/components/library/LibraryMediaCard.svelte',
              "\t\tcollectionName?: string;\n\t}",
              "\t\tcollectionName?: string;\n\t\treturnTo?: string;\n\t}"
          )
          replace_exact(
              'src/lib/components/library/LibraryMediaCard.svelte',
              "\t\tonSelectChange,\n\t\tcollectionName\n\t}: Props = $props();",
              "\t\tonSelectChange,\n\t\tcollectionName,\n\t\treturnTo\n\t}: Props = $props();"
          )
          replace_exact(
              'src/lib/components/library/LibraryMediaCard.svelte',
              "\thref={selectable ? undefined : resolvePath(link)}",
              "\thref={selectable ? undefined : resolvePath(returnTo ? addLibraryReturnTo(link, returnTo) : link)}"
          )

          # Table/mobile-table navigation uses the same explicit mechanism.
          replace_exact(
              'src/lib/components/library/LibraryMediaTable.svelte',
              "\timport { resolvePath } from '$lib/utils/routing';",
              "\timport { addLibraryReturnTo, resolvePath } from '$lib/utils/routing';"
          )
          replace_exact(
              'src/lib/components/library/LibraryMediaTable.svelte',
              "\t\tautoSearchingIds?: Set<string>;\n\t}",
              "\t\tautoSearchingIds?: Set<string>;\n\t\treturnTo?: string;\n\t}"
          )
          replace_exact(
              'src/lib/components/library/LibraryMediaTable.svelte',
              "\t\tdownloadingIds = new Set(),\n\t\tautoSearchingIds = new Set()\n\t}: Props = $props();",
              "\t\tdownloadingIds = new Set(),\n\t\tautoSearchingIds = new Set(),\n\t\treturnTo\n\t}: Props = $props();"
          )
          replace_exact(
              'src/lib/components/library/LibraryMediaTable.svelte',
              "\tfunction navigateToItem(id: string) {\n\t\tgoto(resolvePath(`/library/${mediaType}/${id}`));\n\t}",
              "\tfunction navigateToItem(id: string) {\n\t\tconst detailPath = `/library/${mediaType}/${id}`;\n\t\tgoto(resolvePath(returnTo ? addLibraryReturnTo(detailPath, returnTo) : detailPath));\n\t}"
          )

          # Both list pages expose their *actual* browser URL (including native q replaceState)
          # and pass it to every grid/table/mobile detail navigation.
          for path in ['src/routes/library/movies/+page.svelte', 'src/routes/library/tv/+page.svelte']:
              p = Path(path)
              text = p.read_text()
              marker = "\n\tconst filtered"
              helper = """
\tfunction currentListReturnTo(): string {
\t\tif (typeof window !== 'undefined') {
\t\t\treturn window.location.pathname + window.location.search;
\t\t}
\t\treturn page.url.pathname + page.url.search;
\t}
"""
              if 'function currentListReturnTo()' not in text:
                  idx = text.index(marker)
                  text = text[:idx] + '\n' + helper + text[idx:]
              # Every LibraryMediaCard instance gets an explicit returnTo.
              text = text.replace(
                  "\t\t\t\t\titem={",
                  "\t\t\t\t\treturnTo={currentListReturnTo()}\n\t\t\t\t\titem={"
              )
              # Table instance: place returnTo next to items for both pages.
              text = text.replace(
                  "\t\t\t\t\t\t\titems={renderer.visible}\n",
                  "\t\t\t\t\t\t\titems={renderer.visible}\n\t\t\t\t\t\t\treturnTo={currentListReturnTo()}\n"
              )
              p.write_text(text)

          # Detail headers read returnTo directly from SvelteKit page state (SSR-safe),
          # rather than depending on resolvePath's ambient browser inspection.
          replace_exact(
              'src/lib/components/library/LibrarySeriesHeader.svelte',
              "\timport { resolvePath } from '$lib/utils/routing.js';",
              "\timport { getSafeLibraryReturnTo, resolvePath } from '$lib/utils/routing.js';\n\timport { page } from '$app/state';"
          )
          marker = "\n\tconst overview = $derived(tmdbSeries?.overview ?? series.overview);"
          text = Path('src/lib/components/library/LibrarySeriesHeader.svelte').read_text()
          insert = """
\tconst fallbackBackHref = $derived(
\t\tlibrarySlug ? `/library/tv?library=${encodeURIComponent(librarySlug)}` : '/library/tv'
\t);
\tconst backHref = $derived(
\t\tgetSafeLibraryReturnTo(page.url.searchParams.get('returnTo'), '/library/tv') ?? fallbackBackHref
\t);
"""
          if 'const backHref = $derived(' not in text:
              idx = text.index(marker)
              text = text[:idx] + '\n' + insert + text[idx:]
              Path('src/lib/components/library/LibrarySeriesHeader.svelte').write_text(text)
          replace_exact(
              'src/lib/components/library/LibrarySeriesHeader.svelte',
              "\t\t\thref={resolvePath(librarySlug ? `/library/tv?library=${librarySlug}` : '/library/tv')}",
              "\t\t\thref={resolvePath(backHref)}"
          )

          replace_exact(
              'src/lib/components/library/LibraryMovieHeader.svelte',
              "\timport { resolvePath } from '$lib/utils/routing.js';",
              "\timport { getSafeLibraryReturnTo, resolvePath } from '$lib/utils/routing.js';\n\timport { page } from '$app/state';"
          )
          marker = "\n\tconst overview = $derived(tmdbMovie?.overview ?? movie.overview);"
          text = Path('src/lib/components/library/LibraryMovieHeader.svelte').read_text()
          insert = """
\tconst fallbackBackHref = $derived(
\t\tlibrarySlug ? `/library/movies?library=${encodeURIComponent(librarySlug)}` : '/library/movies'
\t);
\tconst backHref = $derived(
\t\tgetSafeLibraryReturnTo(page.url.searchParams.get('returnTo'), '/library/movies') ??
\t\t\tfallbackBackHref
\t);
"""
          if 'const backHref = $derived(' not in text:
              idx = text.index(marker)
              text = text[:idx] + '\n' + insert + text[idx:]
              Path('src/lib/components/library/LibraryMovieHeader.svelte').write_text(text)
          replace_exact(
              'src/lib/components/library/LibraryMovieHeader.svelte',
              "\t\t\thref={resolvePath(librarySlug ? `/library/movies?library=${librarySlug}` : '/library/movies')}",
              "\t\t\thref={resolvePath(backHref)}"
          )

          # Removing ?edit=1 must not discard returnTo or any other detail query state.
          for path in ['src/routes/library/movie/[id]/+page.svelte', 'src/routes/library/tv/[id]/+page.svelte']:
              replace_exact(
                  path,
                  "\t\tif (page.url.searchParams.get('edit') === '1') {\n\t\t\tgoto(page.url.pathname, { replaceState: true, keepFocus: true, noScroll: true });\n\t\t}",
                  "\t\tif (page.url.searchParams.get('edit') === '1') {\n\t\t\tconst url = new URL(page.url);\n\t\t\turl.searchParams.delete('edit');\n\t\t\tgoto(resolvePath(url.pathname + url.search), {\n\t\t\t\treplaceState: true,\n\t\t\t\tkeepFocus: true,\n\t\t\t\tnoScroll: true\n\t\t\t});\n\t\t}"
              )

          # Regression tests for the explicit path used by UI components.
          path = 'src/lib/utils/routing.test.ts'
          text = Path(path).read_text()
          text = text.replace(
              "import { getLibraryStatefulPath, getSafeLibraryReturnTo } from './routing';",
              "import { addLibraryReturnTo, getLibraryStatefulPath, getSafeLibraryReturnTo } from './routing';"
          )
          marker = "\n\tit('does not use a movie return path for a TV detail page'"
          tests = r'''

	it('explicitly attaches the exact TV list state to a TV detail URL', () => {
		const result = addLibraryReturnTo(
			'/library/tv/series-id',
			'/library/tv?status=continuing&progress=missing&sort=year-desc&q=voyager'
		);
		const url = new URL(result, 'http://cinephage.local');
		expect(url.searchParams.get('returnTo')).toBe(
			'/library/tv?status=continuing&progress=missing&sort=year-desc&q=voyager'
		);
	});

	it('explicitly attaches the exact Movies list state to a movie detail URL', () => {
		const result = addLibraryReturnTo(
			'/library/movie/movie-id',
			'/library/movies?fileStatus=missingFile&sort=added-desc&q=alien'
		);
		const url = new URL(result, 'http://cinephage.local');
		expect(url.searchParams.get('returnTo')).toBe(
			'/library/movies?fileStatus=missingFile&sort=added-desc&q=alien'
		);
	});
'''
          if "explicitly attaches the exact TV list state" not in text:
              idx = text.index(marker)
              text = text[:idx] + tests + text[idx:]
          Path(path).write_text(text)

          # Remove temporary publisher/helper workflows from the actual fix branch diff.
          Path('.github/workflows/apply-explicit-library-return.yml').unlink()
          publisher = Path('.github/workflows/publish-library-filter-test.yml')
          if publisher.exists():
              publisher.unlink()
          PY

      - name: Format changed files
        run: |
          npx prettier --write \
            src/lib/utils/routing.ts \
            src/lib/utils/routing.test.ts \
            src/lib/components/library/LibraryMediaCard.svelte \
            src/lib/components/library/LibraryMediaTable.svelte \
            src/lib/components/library/LibraryMovieHeader.svelte \
            src/lib/components/library/LibrarySeriesHeader.svelte \
            src/routes/library/movies/+page.svelte \
            src/routes/library/tv/+page.svelte \
            'src/routes/library/movie/[id]/+page.svelte' \
            'src/routes/library/tv/[id]/+page.svelte'

      - name: Validate
        run: |
          npm run lint
          npm run check
          npm run test -- --run
          npm run build

      - name: Commit changes
        run: |
          git config user.name 'vampywiz17'
          git config user.email '14281430+vampywiz17@users.noreply.github.com'
          git add -A
          git commit -m 'fix(library): make filtered return navigation explicit'
          git push origin HEAD:fix/library-preserve-filters
