name: Publish library filter test image

on:
  push:
    branches: [fix/library-preserve-filters]
    paths:
      - .github/workflows/publish-library-filter-test.yml

permissions:
  contents: read
  packages: write

jobs:
  publish-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 3b43d83e8c064e24020ccefad1487108289ed225
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push test image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/vampywiz17/cinephage:fix-library-preserve-filters
          build-args: |
            APP_VERSION=fix-library-preserve-filters
          cache-from: type=gha,scope=library-filter-test-amd64
          cache-to: type=gha,mode=max,scope=library-filter-test-amd64
